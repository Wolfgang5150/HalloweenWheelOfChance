(()=>{'use strict';const STORAGE='halloween-wheel-v1';const defaultSegments=[['Grand Prize','👑','#efbe58',3],['Coffee Break','☕','#f7dfb7',10],['Team Treat','🍬','#64305c',10],['Bonus Spin','✦','#f2bd88',10],['Pumpkin Prize','🎃','#df6425',10],['Lucky Pick','🍀','#282b33',10],['Mystery','?','#1c1b27',9],['Early Finish','🌅','#f6dcb5',9],['Snack Time','🧁','#633058',9],['Choose a Colleague','👥','#f9e6c7',8],['Wellness Moment','🌿','#292c31',6],['Extra Break','🪑','#dd7827',6]].map((s,i)=>({id:i+1,label:s[0],icon:s[1],color:s[2],weight:s[3]}));let state={segments:defaultSegments,scale:100,sound:true,duration:7,ambient:true,taper:62,history:[]};try{let saved=JSON.parse(localStorage.getItem(STORAGE));if(saved&&Array.isArray(saved.segments)&&saved.segments.length>1)state={...state,...saved}}catch{}state.scale=100;state.taper=Math.max(0,Math.min(80,Number(state.taper??62)));const $=s=>document.querySelector(s),app=$('#app'),rotor=$('#rotor'),pane=$('#pane');let tab='segments',selected=null,angle=0,spinning=false,audio=null,lastTick=-1;const save=()=>{try{localStorage.setItem(STORAGE,JSON.stringify(state))}catch{}};const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const sum=()=>state.segments.reduce((a,s)=>a+Math.max(0,Number(s.weight)||0),0);const weights=()=>state.segments.map(s=>Math.max(.001,Number(s.weight)||0));function contrast(hex){let c=hex.replace('#','');if(c.length!==6)return '#fff';let r=parseInt(c.slice(0,2),16),g=parseInt(c.slice(2,4),16),b=parseInt(c.slice(4,6),16);return (.2126*r+.7152*g+.0722*b)>148?'#201721':'#fff4d9'}function polar(deg,r){let a=(deg-90)*Math.PI/180;return [250+Math.cos(a)*r,250+Math.sin(a)*r]}function path(start,end){let p1=polar(start,230),p2=polar(end,230);return `M250 250 L${p1[0]} ${p1[1]} A230 230 0 ${end-start>180?1:0} 1 ${p2[0]} ${p2[1]} Z`}function draw(){let total=sum();if(total<=0){$('#result').textContent='Please give at least one segment a positive weight.';return}let ac });rotor.innerHTML=out;rotor.style.transform=`rotate(${angle}deg)`;state.scale=100;app.style.setProperty('--scale',1)}
function audioCtx(){if(!state.sound)return null;try{audio??=new (window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume();return audio}catch{return null}}function beep(freq=600,dur=.055,type='sine',vol=.055){let a=audioCtx();if(!a)return;let o=a.createOscillator(),g=a.createGain();o.type=type;o.frequency.value=freq;g.gain.setValueAtTime(vol,a.currentTime);g.gain.exponentialRampToValueAtTime(.001,a.currentTime+dur);o.connect(g);g.connect(a.destination);o.start();o.stop(a.currentTime+dur)}function fanfare(){[440,554,659,880].forEach((n,i)=>setTimeout(()=>beep(n,.26,'triangle',.08),i*135))}function notify(message){let t=$('#toast');t.textContent=message;t.classList.add('show');clearTimeout(notify.timer);notify.timer=setTimeout(()=>t.classList.remove('show'),2400)}function burst(){let e=$('#burst');e.replaceChildren();for(let i=0;i<32;i++){let sp=document.createElement('span');sp.className='spark';sp.textContent=['✨','⭐','🍁','✦'][i%4];let a=(i/32)*Math.PI*2,r=90+Math.random()*340;sp.style.setProperty('--dx',Math.cos(a)*r+'px');sp.style.setProperty('--dy',Math.sin(a)*r+'px');sp.style.animationDelay=Math.random()*.18+'s';e.appendChild(sp)}setTimeout(()=>e.replaceChildren(),1900)}function spin(){if(spinning||sum()<=0)return;spinning=true;$('#spinBtn').disabled=true;let w=weights(),total=w.reduce((a,b)=>a+b,0),pick=Math.random()*total,idx=0,sofar=0;for(;idx<w.length-1;idx++){if(pick<sofar+w[idx])break;sofar+=w[idx]}let targetStart=360*sofar/total,targetEnd=360*(sofar+w[idx])/total,padding=Math.min((targetEnd-targetStart)*.12,2);let location=targetStart+padding+Math.random()*Math.max(.00001,targetEnd-targetStart-2*padding);let finalMod=(360-location%360)%360,nowMod=((angle%360)+360)%360,delta=((finalMod-nowMod+360)%360)+360*(5+Math.floor(Math.random()*3)),start=angle,end=angle+delta,startTime=performance.now(),dur=state.duration*1000;$('#result').classList.remove('win');$('#result').textContent='🎃 The wheel is spinning…';function frame(now){let t=Math.min(1,(now-startTime)/dur),eased=1-Math.pow(1-t,4);angle=start+delta*eased;rotor.style.transform=`rotate(${angle}deg)`;let tick=Math.floor(angle/((360/state.segments.length)||30));if(tick!==lastTick){if(now-startTime<dur*.95)beep(240+Math.random()*110,.025,'triangle',.016);lastTick=tick}if(t<1){requestAnimationFrame(frame)}else{angle=end;spinning=false;$('#spinBtn').disabled=false;let item=state.segments[idx];$('#result').innerHTML=`🎉 <strong>${esc(item.icon)} ${esc(item.label)}</strong> 🎉`;$('#result').classList.add('win');state.history.unshift({label:item.label,date:new Date().toISOString()});state.history=state.history.slice(0,30);save();burst();fanfare();if(tab==='settings')renderPane()}}requestAnimationFrame(frame)}function renderSegments(){let total=sum();pane.innerHTML=`<div class="buttonrow"><button class="btn primary" id="add">＋ Add Segment</button><button class="btn" id="equal">Equalize</button></div><p class="help">Slice widths automatically follow their weights. A weight of 2 is twice as wide — and twice as likely — as a weight of 1. Total weight: <strong>${total.toFixed(2)}</strong>.</p><div id="rows"></div><div class="summary">${state.segments.length} segments · Winning odds always match their visible slice sizes.</div><div id="detail"></div>`;const rows=$('#rows');rows.innerHTML=state.segments.map((s,i)=>`<div class="segmentrow" data-id="${s.id}"><div class="move"><button class="tiny" data-action="up" data-id="${s.id}" title="Move up">↑</button><button class="tiny" data-action="down" data-id="${s.id}" title="Move down">↓</button></div><span class="swatch" style="background:${esc(s.color)}"></span><input aria-label="Segment label" type="text" data-action="label" data-id="${s.id}" value="${esc(s.label)}" maxlength="65"><input aria-label="Segment weight" data-action="weight" data-id="${s.id}" type="number" min="0.01" max="10000" step="0.5" value="${s.weight}"><button class="tiny" data-action="edit" data-id="${s.id}" title="Edit appearance">✎</button></div>`).join('');rows.querySelectorAll('input').forEach(el=>el.addEventListener('change',()=>{let s=state.segments.find(s=>s.id==el.dataset.id);if(el.dataset.action==='label')s.label=el.value||'Untitled';else s.weight=Math.max(.01,Number(el.value)||1);save();draw();renderSegments()}));rows.querySelectorAll('button').forEach(el=>el.addEventListener('click',()=>{let i=state.segments.findIndex(s=>s.id==el.dataset.id),a=el.dataset.action;if(a==='edit'){selected=state.segments[i].id;renderDetail();return}let j=a==='up'?i-1:i+1;if(j<0||j>=state.segments.length)return;[state.segments[i],state.segments[j]]=[state.segments[j],state.segments[i]];save();draw();renderSegments()}));$('#add').onclick=()=>{let id=Math.max(0,...state.segments.map(x=>x.id))+1;state.segments.push({id,label:'New Prize',icon:'🎁',color:['#d66c2a','#5e305c','#edc78e','#282830'][id%4],weight:1});selected=id;save();draw();renderSegments();renderDetail()};$('#equal').onclick=()=>{state.segments.forEach(s=>s.weight=1);save();draw();renderSegments()};if(selected)renderDetail()}function renderDetail(){let s=state.segments.find(x=>x.id===selected),area=$('#detail');if(!s){area.innerHTML='';return}let odds=(s.weight/sum()*100).toFixed(2);area.innerHTML=`<div class="editor"><h3>Edit: ${esc(s.label)}</h3><div class="help">Current slice: ${odds}% of wheel</div><label class="formfield">Icon or emoji<input id="iconInput" maxlength="8" value="${esc(s.icon)}"></label><label class="formfield">Slice color<input id="colorInput" type="color" value="${esc(s.color)}"></label><div class="buttonrow"><button class="btn" id="duplicate">Duplicate</button><button class="btn" id="delete">Delete</button></div></div>`;$('#iconInput').onchange=e=>{s.icon=e.target.value;save();draw()};$('#colorInput').oninput=e=>{s.color=e.target.value;save();draw()};$('#duplicate').onclick=()=>{let n={...s,id:Math.max(...state.segments.map(x=>x.id))+1,label:s.label+' Copy'};state.segments.splice(state.segments.indexOf(s)+1,0,n);selected=n.id;save();draw();renderSegments()};$('#delete').onclick=()=>{if(state.segments.length<=2){notify('At least two segments are required.');return}state.segments=state.segments.filter(x=>x.id!==s.id);selected=null;save();draw();renderSegments()}}function renderPane(){if(tab==='segments')renderSegments();if(tab==='appearance'){pane.innerHTML=`<div class="sectiontitle">Display</div><div class="summary">Wheel size is locked at <strong>100%</strong> so the layout stays consistent while we design the immersive background. The wheel still responds to screen size automatically.</div><div class="sectiontitle">Wheel lettering</div><div class="summary">Creepster · vertical radial lettering with a dramatic rim-to-hub taper inspired by classic game-show wheels.</div><label class="formfield">Letter taper: <strong id="taperText">${Math.max(0,Math.min(80,Number(state.taper ?? 62)))}%</strong><input type="range" id="taper" min="0" max="80" step="1" value="${Math.max(0,Math.min(80,Number(state.taper ?? 62)))}"></label><p class="help">0% = uniform · 30% = medium · 50% = strong · 65% = dramatic · 80% = extreme. Larger outer letters intentionally fill more of the slice, like a classic Wheel of Fortune BANKRUPT wedge.</p><div class="sectiontitle">Atmosphere</div><label class="formfield"><input id="ambient" type="checkbox" ${state.ambient?'checked':''} style="width:auto;display:inline"> Animated fog, leaves and bats</label>`;$('#taper').oninput=e=>{state.taper=+e.target.value;$('#taperText').textContent=state.taper+'%';save();draw()};$('#ambient').onchange=e=>{state.ambient=e.target.checked;app.classList.toggle('ambient-off',!state.ambient);save()}}if(tab==='settings'){pane.innerHTML=`<div class="sectiontitle">Game settings</div><label class="formfield">Spin duration: <strong id="durationText">${state.duration}s</strong><input id="duration" type="range" min="3" max="15" step="1" value="${state.duration}"></label><label class="formfield"><input id="soundSetting" type="checkbox" ${state.sound?'checked':''} style="width:auto;display:inline"> Sound effects</label><div class="sectiontitle">Recent spins</div>${state.history.length?state.history.slice(0,15).map((x,i)=>`<div class="summary" style="margin:5px 0">${i+1}. ${esc(x.label)} <span class="muted">· ${new Date(x.date).toLocaleTimeString()}</span></div>`).join(''):'<p class="help">No spins yet.</p>'}<div class="buttonrow"><button class="btn" id="clearHistory">Clear History</button><button class="btn" id="reset">Reset to Defaults</button></div>`;$('#duration').oninput=e=>{state.duration=+e.target.value;$('#durationText').textContent=state.duration+'s';save()};$('#soundSetting').onchange=e=>{state.sound=e.target.checked;updateSound();save()};$('#clearHistory').onclick=()=>{state.history=[];save();renderPane()};$('#reset').onclick=()=>{if(!confirm('Reset wheel segments and settings to the Halloween defaults?'))return;state={segments:defaultSegments.map(x=>({...x})),scale:100,sound:true,duration:7,ambient:true,taper:62,history:[]};angle=0;selected=null;save();draw();updateSound();app.classList.remove('ambient-off');renderPane()}}}function updateSound(){$('#soundBtn').innerHTML=(state.sound?'🔊':'🔇')+' <span class="textname">Sound</span>';$('#soundBtn').classList.toggle('active',state.sound)}document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x===b));renderPane()});$('#buildBtn').onclick=()=>{app.classList.toggle('builder-open');$('#buildBtn').classList.toggle('active',app.classList.contains('builder-open'))};$('#closeBtn').onclick=()=>{$('#buildBtn').click()};$('#soundBtn').onclick=()=>{state.sound=!state.sound;save();updateSound();if(state.sound)beep(700,.15)};$('#fullBtn').onclick=async()=>{try{if(!document.fullscreenElement){if(document.documentElement.requestFullscreen)await document.documentElement.requestFullscreen();else notify('For an app-like iPad view, use Safari → Share → Add to Home Screen.')}else await document.exitFullscreen()}catch{notify('Full screen may be unavailable in this browser.')}};$('#spinBtn').onclick=spin;$('#exportBtn').onclick=()=>{let blob=new Blob([JSON.stringify({...state,exportedAt:new Date().toISOString()},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='halloween-wheel-preset.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};$('#importBtn').onclick=()=>$('#importFile').click();$('#importFile').onchange=async e=>{let file=e.target.files[0];if(!file)return;try{let data=JSON.parse(await file.text());if(!Array.isArray(data.segments)||data.segments.length<2||data.segments.length>200||data.segments.some(s=>typeof s.label!=='string'||typeof s.color!=='string'||!/^#[0-9a-fA-F]{6}$/.test(s.color)||!Number.isFinite(+s.weight)||+s.weight<=0))throw Error('Invalid wheel file');state={...state,...data,segments:data.segments.map((s,i)=>({...s,id:i+1,weight:+s.weight}))};state.scale=100;state.taper=Math.max(0,Math.min(80,+state.taper||62));state.duration=Math.max(3,Math.min(15,+state.duration||7));selected=null;save();draw();renderPane();updateSound();notify('Wheel preset imported!')}catch(err){notify('Unable to import: '+err.message)}e.target.value=''};app.classList.toggle('ambient-off',!state.ambient);updateSound();draw();renderPane();document.fonts?.load('24px Creepster').then(()=>draw()).catch(()=>{});})();
</script></body></html>
