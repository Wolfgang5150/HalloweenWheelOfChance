/* v1.7.3: immersive abandoned-carnival scene */
.app{background:#07050d url("assets/haunted-carnival.jpg") center center/cover no-repeat}
.app::before{content:"";position:absolute;inset:0;z-index:0;pointer-events:none;background:linear-gradient(180deg,#05051055 0%,transparent 25%,transparent 70%,#06040d77 100%)}
.sky,.decor,.lantern{display:none!important}
.carnival-lights{position:absolute;inset:0;z-index:2;pointer-events:none;overflow:hidden}
.carnival-lights::before{content:"";position:absolute;inset:0;opacity:.18;background:radial-gradient(circle at 16% 24%,#ff7818 0%,transparent 18%),radial-gradient(circle at 83% 31%,#ac41ff 0%,transparent 23%),radial-gradient(circle at 50% 14%,#ffa92b 0%,transparent 15%);mix-blend-mode:screen;animation:carnival-idle 9s ease-in-out infinite alternate}

.app.spinning .carnival-lights::after{animation:carnival-chase .52s steps(2,end) infinite}
.app.spinning .carnival-lights::before{animation:carnival-pulse .85s ease-in-out infinite alternate}
.carnival-fog{position:absolute;left:-28%;bottom:-12%;width:155%;height:35%;z-index:6;pointer-events:none;filter:blur(24px);opacity:.4;background:radial-gradient(ellipse at 30% 80%,#c9b4d995,transparent 52%),radial-gradient(ellipse at 73% 64%,#9f78b188,transparent 54%);animation:carnival-fog-drift 18s ease-in-out infinite alternate}
.carnival-fog.fog-two{bottom:-17%;height:28%;opacity:.28;animation-duration:26s;animation-delay:-10s;transform:scaleX(-1)}
.ambient-off .carnival-fog,.ambient-off .carnival-lights::before{animation:none}
.topbar{z-index:12}.branding{background:linear-gradient(90deg,#090613c9,transparent);padding:8px 25px 12px 9px;border-radius:8px;text-shadow:0 3px 9px #000}
.branding h1{font-size:clamp(19px,2.1vw,32px)}
.main{z-index:3}.wheel-wrap{filter:drop-shadow(0 0 14px #07030f) drop-shadow(0 20px 20px #000b)}
.spinbtn{box-shadow:0 0 0 4px #45250e,0 0 24px #e97622b0,inset 0 0 14px #ffd280}
